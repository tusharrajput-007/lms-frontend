<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LMS</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <style>
      body { background: #f4f7fa; }
      .layout { display: flex; min-height: 100vh; }
      .sidebar {
        width: 240px; background: #1f2937; color: #fff;
        padding: 20px 0; flex-shrink: 0;
      }
      .sidebar .brand {
        font-size: 1.4rem; font-weight: 700; padding: 0 20px 20px;
        border-bottom: 1px solid #374151; margin-bottom: 16px;
      }
      .sidebar a {
        display: block; padding: 10px 20px; color: #d1d5db;
        text-decoration: none;
      }
      .sidebar a:hover, .sidebar a.active {
        background: #374151; color: #fff;
      }
      .main { flex: 1; }
      .topbar {
        background: #fff; padding: 12px 24px; display: flex;
        justify-content: space-between; align-items: center;
        border-bottom: 1px solid #e5e7eb;
      }
      .content { padding: 24px; }
      .card { box-shadow: 0 1px 3px rgba(0,0,0,.06); }
      .auth-wrapper {
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #4f46e5, #06b6d4);
      }
      .auth-card { width: 420px; max-width: 90vw; background: #fff;
        border-radius: 8px; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,.15); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
